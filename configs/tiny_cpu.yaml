# Tiny config for CPU smoke runs.
model:
  vocab_size: 10000
  context_length: 256
  d_model: 128
  num_layers: 4
  num_heads: 4
  d_ff: 512
  rope_theta: 10000.0
  tied_embeddings: true

training:
  device: cpu
  dtype: float32
  batch_size: 4
  max_steps: 200
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_iters: 20
  cosine_cycle_iters: 200
  grad_clip: 1.0
  weight_decay: 0.01
  log_every: 10
  eval_every: 50

data:
  train_tokens: data/processed/tinystories_train.npy
  valid_tokens: data/processed/tinystories_valid.npy

seed: 0
