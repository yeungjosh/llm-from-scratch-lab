# Tiny config for Apple silicon MPS.
model:
  vocab_size: 10000
  context_length: 512
  d_model: 256
  num_layers: 6
  num_heads: 8
  d_ff: 1024
  rope_theta: 10000.0
  tied_embeddings: true

training:
  device: mps
  dtype: bfloat16
  batch_size: 8
  max_steps: 2000
  max_lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_iters: 100
  cosine_cycle_iters: 2000
  grad_clip: 1.0
  weight_decay: 0.01
  log_every: 25
  eval_every: 250

data:
  train_tokens: data/processed/tinystories_train.npy
  valid_tokens: data/processed/tinystories_valid.npy

seed: 0
