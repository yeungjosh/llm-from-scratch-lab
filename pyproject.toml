[project]
name = "lfslab"
version = "0.0.1"
description = "CS336-inspired LLM-from-scratch lab — MacBook-feasible. Tokenizer, tiny transformer, profiler, scaling estimator, Streamlit explorer."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Josh Yeung", email = "ymsbjosh@gmail.com" }]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "regex>=2024.5",
    "jaxtyping>=0.2.30",
    "einops>=0.8",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pandas>=2.2",
]

[project.optional-dependencies]
data = ["datasets>=2.20", "huggingface_hub>=0.24"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "gpu: tests that require a non-CPU device",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape strings look like forward refs to ruff.
"tests/adapters.py" = ["F722", "F821"]
"src/lfslab/model.py" = ["F722", "F821"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
